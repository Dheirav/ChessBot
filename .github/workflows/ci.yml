name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The GUI binary needs SFML, and so does tests/guiinput, which drives the
      # input state machine using SFML's event types (without opening a window).
      # Every other test target links without it.
      - name: Install SFML
        run: sudo apt-get update && sudo apt-get install -y libsfml-dev

      - name: Build application
        run: make -j$(nproc)

      - name: Build tests
        run: make -j$(nproc) tests

      # Move generation against published perft counts. Exact — a single wrong
      # or missing move shows up as a mismatched leaf count.
      - name: perft
        run: make test-perft

      # Terminal detection: a finished game refuses moves, and terminal state
      # is not sticky across a new game.
      - name: game state
        run: make test-gamestate

      # Every evaluation term against a stored reference over 23k positions.
      - name: evaluation regression
        run: make test-evalref

      # The search's node-count signature. Fails when the tree changes, which
      # is the point: an intentional change is reviewed and regenerated.
      - name: search bench
        run: make test-bench

      # Static exchange evaluation, checked against hand-computed positions.
      # One of the few strength-affecting parts that needs no match to verify.
      - name: static exchange evaluation
        run: make test-see

      # Magic tables exhaustively, plus attack/checker/pin queries cross-checked
      # against the mailbox engine. Magic bitboards fail silently, so nothing
      # short of exhaustive verification is worth anything here.
      - name: bitboard attacks
        run: make test-bitboard

      # A search given a clock must return inside it; one that does not hangs
      # the GUI and forfeits on time.
      - name: time control
        run: make test-timecontrol

      # The UCI protocol, which is how any external tool drives the engine.
      - name: UCI protocol
        run: make test-uci

      # Board input: selection, click-to-move, dragging, and the promotion
      # dialog's hitboxes against the geometry it is drawn with. Headless — it
      # builds the frames' worth of state without opening a window.
      - name: GUI input
        run: make test-guiinput

      # PGN export. SAN is unambiguous only if the writer does the
      # disambiguation work, and a wrong spelling replays a different game.
      - name: PGN export
        run: make test-pgn

      # Not a strength measurement — just a check that the engine plays a legal
      # game end to end. Real matches are far too long for CI.
      - name: match smoke test
        run: ./tests/match 2 4 20260810
