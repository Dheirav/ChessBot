# ChessBot configuration
# This file is optional. If it is missing, the built-in defaults in
# src/config.hpp are used. Keys are matched case-insensitively to the
# `key` spelling below. Lines starting with # are comments.

# Maximum search depth for the engine (1..10). Iterative deepening stops here.
searchDepth = 5

# Transposition table size in megabytes (>= 8).
transpositionTableSizeMB = 256