# ChessBot configuration
# This file is optional. If it is missing, the built-in defaults in
# src/config.hpp are used. Keys are matched case-insensitively to the
# `key` spelling below. Lines starting with # are comments.

# Wall-clock budget per move, in milliseconds. This is normally what ends the
# engine's search. A fixed depth cannot do the job on its own: the same depth
# costs milliseconds in a sparse endgame and seconds in a dense middlegame, so
# it either wastes time or overruns. Set to 0 to search purely by depth.
moveTimeMs = 3000

# Ceiling on iterative deepening (1..64). With a budget set this is a safety
# limit rather than the usual stopping condition, so it can sit high: a
# position the engine can search cheaply should be allowed to go deep.
searchDepth = 8

# Transposition table size in megabytes (>= 8).
transpositionTableSizeMB = 256

# Dump every evaluation term, per move, to evaluation_log_<epoch>.txt in the
# working directory. Off by default: this used to be unconditional, so every
# run left another file behind and nothing read them. `make test-evalref`
# covers evaluation regressions properly, over 24k positions against a stored
# reference; this switch is for looking at a single game by hand.
logEvaluations = off
